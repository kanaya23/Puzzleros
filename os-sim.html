<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile OS Installation Simulator</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffffff;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 14px;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 10px;
            box-sizing: border-box;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            -webkit-overflow-scrolling: touch;
        }

        #input-line {
            display: flex;
            align-items: center;
            min-height: 24px;
        }

        #prompt {
            margin-right: 5px;
            white-space: nowrap;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #ffffff;
            padding: 0;
            margin: 0;
        }

        /* Editor Overlay */
        #editor {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            color: #ffffff;
            z-index: 100;
            flex-direction: column;
            font-family: inherit;
        }

        #editor-header {
            padding: 10px;
            border-bottom: 1px solid #ffffff;
            text-align: center;
            font-weight: bold;
            background: #111;
        }

        #editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .editor-line {
            padding: 8px 5px;
            border-bottom: 1px dashed #333;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: rgba(255, 176, 0, 0.2);
        }

        .editor-line.commented {
            color: #666;
        }

        #editor-footer {
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            border-top: 1px solid #ffffff;
            background: #111;
        }

        #editor-footer button {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
            margin: 0 5px;
        }
        
        #editor-footer button:active {
            background: #ffffff;
            color: #000;
        }

        /* Ensure consistent white-on-black for all states */
        #editor-content, #editor-header, #editor-footer {
            color-scheme: dark;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">C:\></span>
            <input type="text" id="command-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <div id="editor">
        <div id="editor-header">/etc/pacman.conf</div>
        <div id="editor-content"></div>
        <div id="editor-footer">
            <button id="editor-save">^O Save</button>
            <button id="editor-exit">^X Exit</button>
        </div>
    </div>

    <script>
        const VirtualKernel = {
            powerState: "MS_DOS",
            currentDirectory: "/",
            isChrooted: false,
            networkState: {
                linkSpeed: "1000Mbps",
                hasCarrier: true,
                dnsResolved: false
            },
            systemClock: {
                utcTime: 1781023271000,
                timeZone: null,
                hwClockSynced: false
            },
            blockDevices: {
                "/dev/sda": {
                    size: "20.0 GiB",
                    diskLabel: "gpt",
                    partitions: {
                        "/dev/sda1": { size: "512M", type: "vfat", formatted: false, label: "EFI System" },
                        "/dev/sda2": { size: "19.5G", type: null, formatted: false, label: "Linux Filesystem" }
                    }
                }
            },
            mounts: {
                "/mnt": null,
                "/mnt/boot": null
            },
            fileSystem: {},
            env: {
                "PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                "LANG": "en_US.UTF-8",
                "SHELL": "/bin/bash"
            },
            mathSeries: [],
            mathAnswer: 4,
            bootFlags: {
                grubInstalled: false,
                grubConfigured: false
            }
        };

        const initFS = () => {
            VirtualKernel.fileSystem = {
                "/": {
                    type: "d", children: {
                        "dev": { type: "d", children: { "sda": { type: "b" }, "sda1": { type: "b" }, "sda2": { type: "b" } } },
                        "sys": { type: "d", children: {} },
                        "proc": { type: "d", children: {} },
                        "mnt": { type: "d", children: {} },
                        "etc": { type: "d", children: {
                            "fstab": { type: "f", content: "" },
                            "localtime": { type: "l", target: null },
                            "hostname": { type: "f", content: "" },
                            "pacman.conf": { type: "f", content: `# [testing]\n# Include = /etc/pacman.d/mirrorlist\n\n[core]\nInclude = /etc/pacman.d/mirrorlist\n\n[extra]\nInclude = /etc/pacman.d/mirrorlist\n\n# Secure Local Network Configuration Repository\n#[core-sync-repo]\n#Server = https://secure.network.local/endpoint` }
                        } },
                        "usr": { type: "d", children: {
                            "bin": { type: "d", children: { "bash": { type: "f" } } },
                            "share": { type: "d", children: { "zoneinfo": { type: "d", children: { "Asia": { type: "d", children: { "Jakarta": { type: "f", content: "ZoneInfo Data" } } } } } } }
                        } },
                        "boot": { type: "d", children: { "grub": { type: "d", children: { "grub.cfg": { type: "f", content: "" } } } } },
                        "home": { type: "d", children: { "jew": { type: "d", children: { "README.txt": { type: "f", content: "System active.\nTo configure connection links:\n1. Edit config in /etc/pacman.conf\n2. Uncomment the local target server.\n3. Synchronize package tree: sudo pacman -Sy core-sync" } } } } }
                    }
                }
            };
        };

        const SAVE_KEY = 'puzzleros_save';

        const saveState = () => {
            try {
                const data = JSON.stringify(VirtualKernel);
                localStorage.setItem(SAVE_KEY, data);
            } catch (e) {}
        };

        const loadState = () => {
            try {
                const data = localStorage.getItem(SAVE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    Object.assign(VirtualKernel, parsed);
                    return parsed.powerState && parsed.powerState !== "MS_DOS";
                }
            } catch (e) {}
            return false;
        };

        const clearSave = () => {
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        };

        const delay = (ms) => new Promise(r => setTimeout(r, ms));

        const print = (text) => {
            const output = document.getElementById('output');
            const line = document.createElement('div');
            line.textContent = text;
            output.appendChild(line);
            requestAnimationFrame(() => {
                output.scrollTop = output.scrollHeight;
            });
        };

        const updateLastLine = (text) => {
            const output = document.getElementById('output');
            const last = output.lastElementChild;
            if (last) last.textContent = text;
            requestAnimationFrame(() => {
                output.scrollTop = output.scrollHeight;
            });
        };

        const showProgress = async (prefix, steps, interval) => {
            const barLen = 20;
            for (let i = 1; i <= steps; i++) {
                const pct = Math.round(i / steps * 100);
                const filled = Math.round(i / steps * barLen);
                const bar = '█'.repeat(filled) + '░'.repeat(barLen - filled);
                updateLastLine(`${prefix} [${bar}] ${pct}%`);
                await delay(interval);
            }
        };

        const resolvePath = (path) => {
            let base = "";
            if (VirtualKernel.isChrooted && !path.startsWith("/mnt")) {
                base = "/mnt";
            }
            
            if (path.startsWith("/")) {
                path = base + path;
            } else if (path === "~") {
                path = base + "/home/jew";
            } else if (path.startsWith("~/")) {
                path = base + "/home/jew/" + path.slice(2);
            } else {
                let current = VirtualKernel.currentDirectory;
                if (current === "/") current = "";
                path = base + current + "/" + path;
            }
            
            const parts = path.split("/").filter(p => p);
            const resolved = [];
            for (const p of parts) {
                if (p === ".") continue;
                if (p === "..") resolved.pop();
                else resolved.push(p);
            }
            return "/" + resolved.join("/");
        };

        const getNode = (path) => {
            const resolved = resolvePath(path);
            if (resolved === "/") return VirtualKernel.fileSystem["/"];
            
            const parts = resolved.split("/").filter(p => p);
            let node = VirtualKernel.fileSystem["/"];
            for (const p of parts) {
                if (!node.children || !node.children[p]) return null;
                node = node.children[p];
            }
            return node;
        };

        const getPrompt = () => {
            if (VirtualKernel.powerState === "STAGE1_INPUT") return "Input: ";
            if (VirtualKernel.powerState === "STAGE2_SELECT") return "Input Option [1-2]: ";
            if (VirtualKernel.powerState === "LIVE_ISO") {
                const dir = VirtualKernel.currentDirectory === "/" ? "~" : VirtualKernel.currentDirectory;
                return VirtualKernel.isChrooted ? "sh-5.2# " : `root@archiso ${dir} # `;
            }
            if (VirtualKernel.powerState === "STAGE3_LOGIN") return "arch-jew login: ";
            if (VirtualKernel.powerState === "STAGE3_PASSWORD") return "Password: ";
            if (VirtualKernel.powerState === "STAGE3_PACMAN") return ""; 
            if (VirtualKernel.powerState === "INSTALLED_SHELL") {
                const dir = VirtualKernel.currentDirectory.replace('/home/jew', '~');
                return `[jew@arch-jew ${dir}]$ `;
            }
            return "C:\\>";
        };

        const updatePrompt = () => {
            document.getElementById('prompt').textContent = getPrompt();
            const input = document.getElementById('command-input');
            const isSecret = VirtualKernel.powerState === "STAGE3_PASSWORD" || VirtualKernel.powerState === "STAGE3_PACMAN";
            input.type = "text";
            input.style.color = isSecret ? "transparent" : "";
            input.style.caretColor = isSecret ? "#ffffff" : "";
            input.focus();
        };

        const startStage1 = () => {
            const X = Math.floor(Math.random() * 50) + 1;
            VirtualKernel.mathSeries = Array.from({length: 7}, (_, i) => X + i);
            print("Microsoft(R) MS-DOS(R) Version 6.22");
            print("(C)Copyright Microsoft Corp 1981-1994.");
            print("");
            print("C:\\>");
            print("Divide overflow");
            print("");
            print("To find the password solve");
            print(`Question: Calculate the variance (Nilai Ragam) of [ ${VirtualKernel.mathSeries.join(', ')} ]`);
            print("Input: _");
            VirtualKernel.powerState = "STAGE1_INPUT";
            printInstruction();
        };

        const startStage2 = () => {
            print("Access Gwanted" + (addUwu() ? " UwU" : "") + ". Loading OS_SELECT.COM...");
            print("");
            print("Select a Linux distribution to install:");
            print("1. Arch Linux (Manual Bootstrap)");
            print("2. Ubuntu 24.04 LTS (Automated GUI Setup)");
            print("");
            print("Input Option [1-2]: _");
            VirtualKernel.powerState = "STAGE2_SELECT";
        };

        const startArchInstall = () => {
            print("Shifting execution context" + (addUwu() ? " (teehee~)" : "") + "...");
            print("Scanning x86 hardware...");
            print("Loading live ISO installation environment...");
            print("");
            print("Tip: Type 'hint' at any prompt to view exact commands and explanations." + (addUwu() ? " (>w<)" : ""));
            VirtualKernel.powerState = "LIVE_ISO";
            printInstruction();
        };

        const startStage3Boot = async () => {
            // Remap installed system files to root
            const mntChildren = VirtualKernel.fileSystem["/"].children["mnt"].children;
            Object.assign(VirtualKernel.fileSystem["/"].children, mntChildren);

            print(":: Arch Linux 6.7.arch1-1 (TTY1)");
            await delay(400);
            print("[  OK  ] Started Journal Service.");
            await delay(300);
            print("[  OK  ] Started udev Coldplug Service.");
            await delay(250);
            print("[  OK  ] Created Slice User Slices.");
            await delay(300);
            print("[  OK  ] Started Accounts Service.");
            await delay(400);
            print("[  OK  ] Reached target Multi-User System.");
            await delay(500);
            print("");
            VirtualKernel.powerState = "STAGE3_LOGIN";
            printInstruction();
        };

        const uwuFillin = () => {
            const fillers = [
                " (don't wowwy, u can do it! ^w^)",
                " (>w< gow faast!)",
                " (heehee :3)",
                " (owo)",
                " (rawr x3)",
                " (p-pwease be caweful... UwU)",
                " (u got this, fwiend! >w<)",
                " (teehee ~)",
                " (nya~ ^,..,^)",
                " (U w U)",
            ];
            return fillers[Math.floor(Math.random() * fillers.length)];
        };

        const addUwu = () => Math.random() < 0.25;

        const printHint = () => {
            if (VirtualKernel.powerState === "STAGE1_INPUT") {
                print("Hint: The variance of any 7 consecutive integers is constant.");
                print("Calculate the population variance (Nilai Ragam) of the series." + (addUwu() ? uwuFillin() : ""));
            } else if (VirtualKernel.powerState === "LIVE_ISO") {
                if (!VirtualKernel.networkState.dnsResolved) {
                    print("Hint: Verify remote host packet response: `ping -c 3 archlinux.org`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda2"].formatted) {
                    print("Hint: Initialize raw block /dev/sda2 to system-standard ext4 formatting: `mkfs.ext4 /dev/sda2`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda1"].formatted) {
                    print("Hint: Initialize the EFI system partition with FAT32: `mkfs.vfat /dev/sda1`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.mounts["/mnt"]) {
                    print("Hint: Mount formatted partition sda2 to root mount interface: `mount /dev/sda2 /mnt`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.mounts["/mnt/boot"]) {
                    print("Hint: Mount the EFI system partition to the boot directory: `mount /dev/sda1 /mnt/boot`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.fileSystem["/"].children["mnt"].children["usr"]) {
                    print("Hint: Bootstrap essential core packages to the mountpoint: `pacstrap -K /mnt base linux linux-firmware`" + (addUwu() ? uwuFillin() : ""));
                } else if (VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["fstab"].content === "") {
                    print("Hint: Write system block references to fstab filesystem register: `genfstab -U /mnt >> /mnt/etc/fstab`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.isChrooted) {
                    print("Hint: Enter target partition chroot framework: `arch-chroot /mnt`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["localtime"].target) {
                    print("Hint: Build relative local clock pointer: `ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime`" + (addUwu() ? uwuFillin() : ""));
                } else if (VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["hostname"].content === "") {
                    print("Hint: Write machine network identity: `echo \"arch-jew\" > /etc/hostname`" + (addUwu() ? uwuFillin() : ""));
                } else if (!VirtualKernel.bootFlags.grubInstalled) {
                    if (VirtualKernel.mounts["/mnt/boot"]) {
                        print("Hint: Write EFI bootloader to the drive: `grub-install --target=x86_64-efi --efi-directory=/boot /dev/sda`" + (addUwu() ? uwuFillin() : ""));
                    } else {
                        print("Hint: Write partition bootloader blocks to sda: `grub-install /dev/sda`" + (addUwu() ? uwuFillin() : ""));
                    }
                } else if (!VirtualKernel.bootFlags.grubConfigured) {
                    print("Hint: Build GRUB config file: `grub-mkconfig -o /boot/grub/grub.cfg`" + (addUwu() ? uwuFillin() : ""));
                } else {
                    print("Hint: Command chroot context termination: `exit`, then `reboot`" + (addUwu() ? uwuFillin() : ""));
                }
            } else if (VirtualKernel.powerState === "INSTALLED_SHELL") {
                print("Hint: Type `cat README.txt` for instructions." + (addUwu() ? uwuFillin() : ""));
                print("Then `nano /etc/pacman.conf` to edit the config.");
                print("In the editor, tap any line starting with # to uncomment it.");
                print("Uncomment the [core-sync-repo] and Server lines, then save and exit.");
                print("Finally run: `sudo pacman -Sy core-sync`" + (addUwu() ? uwuFillin() : ""));
            } else if (VirtualKernel.powerState === "STAGE3_LOGIN") {
                print("Hint: The authorized system user is `jew`. Enter the username to proceed." + (addUwu() ? uwuFillin() : ""));
            } else if (VirtualKernel.powerState === "STAGE3_PASSWORD") {
                print("Hint: The password is 4 (the variance answer from Stage 1)." + (addUwu() ? uwuFillin() : ""));
            } else if (VirtualKernel.powerState === "STAGE3_PACMAN") {
                print("Hint: The password is 4 (the variance answer from Stage 1). Type it and press Enter." + (addUwu() ? uwuFillin() : ""));
            }
        };

        const printInstruction = () => {
            const u = () => addUwu() ? " " + uwuFillin().trim() : "";
            print(""); // Visual spacer
            if (VirtualKernel.powerState === "STAGE1_INPUT") {
                print("[Instruction]: Resolve the arithmetic :3 lock." + u());
            } else if (VirtualKernel.powerState === "LIVE_ISO") {
                if (!VirtualKernel.networkState.dnsResolved) {
                    print("[Instruction]: Check the internet connection by pinging archlinux.org" + u());
                } else if (!VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda2"].formatted) {
                    print("[Instruction]: Format the secondary target partition of the system disk." + u());
                } else if (!VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda1"].formatted) {
                    print("[Instruction]: Format the EFI system partition with a FAT filesystem." + u());
                } else if (!VirtualKernel.mounts["/mnt"]) {
                    print("[Instruction]: Associate the formatted workspace node with the default setup mount point." + u());
                } else if (!VirtualKernel.mounts["/mnt/boot"]) {
                    print("[Instruction]: Mount the EFI system partition to the boot directory." + u());
                } else if (!VirtualKernel.fileSystem["/"].children["mnt"].children["usr"]) {
                    print("[Instruction]: Bootstrap basic base system structures, kernel packages, and firmware to the setup point." + u());
                } else if (VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["fstab"].content === "") {
                    print("[Instruction]: Establish persistent partition table records inside the system configuration path." + u());
                } else if (VirtualKernel.bootFlags.grubConfigured && !VirtualKernel.isChrooted) {
                    print("[Instruction]: Terminate active chroot process loops and reboot." + u());
                } else if (!VirtualKernel.isChrooted) {
                    print("[Instruction]: Pivot execution context into the target machine." + u());
                } else if (!VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["localtime"].target) {
                    print("[Instruction]: Form timezone configuration pathways for local Jakarta region." + u());
                } else if (VirtualKernel.fileSystem["/"].children["mnt"].children["etc"].children["hostname"].content === "") {
                    print("[Instruction]: Define the system identifier as arch-jew." + u());
                } else if (!VirtualKernel.bootFlags.grubInstalled) {
                    if (VirtualKernel.mounts["/mnt/boot"]) {
                        print("[Instruction]: Install the UEFI bootloader to the system drive." + u());
                    } else {
                        print("[Instruction]: Install primary system load registers to the drive." + u());
                    }
                } else if (!VirtualKernel.bootFlags.grubConfigured) {
                    print("[Instruction]: Build dynamic boot sequence configurations." + u());
                } else {
                    print("[Instruction]: Terminate active chroot process loops and reboot." + u());
                }
            } else if (VirtualKernel.powerState === "STAGE3_LOGIN") {
                print("[Instruction]: Input authorized system user to proceed." + u());
            } else if (VirtualKernel.powerState === "STAGE3_PASSWORD") {
                print("[Instruction]: Provide the cryptographic key derived from the initial boot sequence." + u());
            } else if (VirtualKernel.powerState === "INSTALLED_SHELL") {
                print("[Instruction]: Review local system documentation to configure the secure network repository." + u());
            } else if (VirtualKernel.powerState === "STAGE3_PACMAN") {
                print("[Instruction]: Authenticate superuser privileges to finalize the package synchronization." + u());
            }
        };

        const handlePing = async (args) => {
            const target = args.filter(a => !a.startsWith("-") && !/^\d+$/.test(a))[0];
            if (!target) {
                print("ping: usage error: missing host operand");
                return;
            }
            if (target === "archlinux.org" || target === "8.8.8.8" || target === "google.com") {
                print(`PING ${target} (95.217.163.246) 56(84) bytes of data.`);
                for (let i = 1; i <= 3; i++) {
                    await delay(600 + Math.random() * 200);
                    print(`64 bytes from 95.217.163.246: icmp_seq=${i} ttl=56 time=${(11 + Math.random() * 2).toFixed(1)} ms`);
                }
                await delay(200);
                print("");
                print(`--- ${target} ping statistics ---`);
                print("3 packets transmitted, 3 received, 0% packet loss, time 2003ms");
                VirtualKernel.networkState.dnsResolved = true;
                printInstruction();
            } else {
                print(`ping: ${target}: Temporary failure in name resolution`);
            }
        };

        const handleMkfs = async (args) => {
            if (args.includes("/dev/sda2")) {
                print("mke2fs 1.47.0 (5-Feb-2023)");
                print("Creating filesystem with 5111808 4k blocks and 1278240 inodes");
                await delay(400);
                print("Filesystem UUID: 12345678-1234-1234-1234-1234567890ab");
                await showProgress("Allocating group tables", 10, 80);
                print("Allocating group tables: done");
                await showProgress("Writing inode tables", 15, 60);
                print("Writing inode tables: done");
                await showProgress("Creating journal (32768 blocks)", 8, 70);
                print("Creating journal (32768 blocks): done");
                await delay(200);
                print("Writing superblocks and filesystem accounting information: done");
                VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda2"].formatted = true;
                VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda2"].type = "ext4";
                printInstruction();
            } else if (args.includes("/dev/sda1")) {
                print("mkfs.fat 4.2 (2021-01-31)");
                await delay(200);
                print("SHA-256: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef");
                print("Creating filesystem with 524288 1k blocks and 0 inodes");
                await delay(300);
                print("Filesystem UUID: 09876543-2109-8765-4321-0987654321ab");
                await showProgress("Allocating group tables", 6, 60);
                print("Allocating group tables: done");
                await showProgress("Writing inode tables", 8, 50);
                print("Writing inode tables: done");
                await delay(200);
                print("Writing superblocks and filesystem accounting information: done");
                VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda1"].formatted = true;
                VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda1"].type = "vfat";
                printInstruction();
            } else {
                print("mkfs: missing or invalid device");
            }
        };

        const handleMount = (args) => {
            if (args.length >= 2 && args[0] === "/dev/sda2" && args[1] === "/mnt") {
                if (!VirtualKernel.blockDevices["/dev/sda"].partitions["/dev/sda2"].formatted) {
                    print("mount: /mnt: wrong fs type, bad option, bad superblock on /dev/sda2, missing codepage or helper program, or other error.");
                    return;
                }
                VirtualKernel.mounts["/mnt"] = "/dev/sda2";
                VirtualKernel.fileSystem["/"].children["mnt"].children = {
                    "usr": { type: "d", children: {} },
                    "etc": { type: "d", children: { "fstab": { type: "f", content: "" } } },

                    print("--- Session westowed" + (addUwu() ? " :3" : "") + " ---");
                }
                printInstruction();
            }
            
            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const val = input.value;
                    input.value = '';
                    await processCommand(val);
                    updatePrompt();
                    const output = document.getElementById('output');
                    output.scrollTop = output.scrollHeight;
                }
            });
            
            document.body.addEventListener('click', () => {
                if (document.getElementById('editor').style.display !== 'flex') {
                    input.focus();
                }
            });
        };
    </script>
</body>
</html>
