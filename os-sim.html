<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile OS Installation Simulator</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffffff;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 14px;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 10px;
            box-sizing: border-box;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            -webkit-overflow-scrolling: touch;
        }

        #input-line {
            display: flex;
            align-items: center;
            min-height: 24px;
        }

        #prompt {
            margin-right: 5px;
            white-space: nowrap;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #ffffff;
            padding: 0;
            margin: 0;
        }

        /* Editor Overlay */
        #editor {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            color: #ffffff;
            z-index: 100;
            flex-direction: column;
            font-family: inherit;
        }

        #editor-header {
            padding: 10px;
            border-bottom: 1px solid #ffffff;
            text-align: center;
            font-weight: bold;
            background: #111;
        }

        #editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .editor-line {
            padding: 8px 5px;
            border-bottom: 1px dashed #333;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: rgba(255, 176, 0, 0.2);
        }

        .editor-line.commented {
            color: #666;
        }

        #editor-footer {
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            border-top: 1px solid #ffffff;
            background: #111;
        }

        #editor-footer button {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
            margin: 0 5px;
        }
        
        #editor-footer button:active {
            background: #ffffff;
            color: #000;
        }

        /* Ensure consistent white-on-black for all states */
        #editor-content, #editor-header, #editor-footer {
            color-scheme: dark;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">C:\></span>
            <input type="text" id="command-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <div id="editor">
        <div id="editor-header">/etc/pacman.conf</div>
        <div id="editor-content"></div>
        <div id="editor-footer">
            <button id="editor-save">^O Save</button>
            <button id="editor-exit">^X Exit</button>
        </div>
    </div>

    <script>

                    { pid: 202, name: "systemd-udevd", user: "root", cpu: 0.0, mem: 0.0, state: "Ss", cmd: "/usr/lib/systemd/systemd-udevd" },
                    { pid: 445, name: "bash", user: "jew", cpu: 0.3, mem: 0.3, state: "S", cmd: "bash" },

        const initFS = () => {
            VirtualKernel.fileSystem = {
                "/": {
                    type: "d", children: {

        };

        const SAVE_KEY = 'puzzleros_save';

        const saveState = () => {
            try {
                const data = JSON.stringify(VirtualKernel);
                localStorage.setItem(SAVE_KEY, data);
            } catch (e) {}
        };

        const loadState = () => {
            try {
                const data = localStorage.getItem(SAVE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    Object.assign(VirtualKernel, parsed);
                    return parsed.powerState && parsed.powerState !== "MS_DOS";
                }
            } catch (e) {}
            return false;
        };

        const clearSave = () => {
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        };

        const delay = (ms) => new Promise(r => setTimeout(r, ms));

        let _captureBuf = null;
        let _stdinData = "";
        const EPILOGUE_REPOS = ["base-devel", "linux-headers", "git", "curl", "neofetch", "htop", "sl", "cmatrix", "cowsay", "lolcat"];
        const print = (text) => {
            if (_captureBuf) { _captureBuf.push(text); return; }
            const output = document.getElementById('output');
            const line = document.createElement('div');
            line.textContent = text;
            output.appendChild(line);
            requestAnimationFrame(() => {
                output.scrollTop = output.scrollHeight;
            });
        };

        const updateLastLine = (text) => {
            const output = document.getElementById('output');
            const last = output.lastElementChild;
            if (last) last.textContent = text;
            requestAnimationFrame(() => {
                output.scrollTop = output.scrollHeight;
            });
        };

        const showProgress = async (prefix, steps, interval) => {
            const barLen = 20;
            for (let i = 1; i <= steps; i++) {
                const pct = Math.round(i / steps * 100);
                const filled = Math.round(i / steps * barLen);
                const bar = '█'.repeat(filled) + '░'.repeat(barLen - filled);
                updateLastLine(`${prefix} [${bar}] ${pct}%`);
                await delay(interval);
            }
        };

        const resolvePath = (path) => {
            let base = "";
            if (VirtualKernel.isChrooted && !path.startsWith("/mnt")) {
                base = "/mnt";
            }
            
            if (path.startsWith("/")) {
                path = base + path;
            } else if (path === "~") {
                path = base + "/home/jew";
            } else if (path.startsWith("~/")) {
                path = base + "/home/jew/" + path.slice(2);
            } else {
                let current = VirtualKernel.currentDirectory;
                if (current === "/") current = "";
                path = base + current + "/" + path;
            }
            
            const parts = path.split("/").filter(p => p);
            const resolved = [];
            for (const p of parts) {
                if (p === ".") continue;
                if (p === "..") resolved.pop();
                else resolved.push(p);
            }
            return "/" + resolved.join("/");
        };

        const getNode = (path) => {
            const resolved = resolvePath(path);
            if (resolved === "/") return VirtualKernel.fileSystem["/"];
            
            const parts = resolved.split("/").filter(p => p);
            let node = VirtualKernel.fileSystem["/"];
            for (const p of parts) {
                if (!node.children || !node.children[p]) return null;
                node = node.children[p];
            }
            return node;
        };

        const ensureParent = (path) => {
            const resolved = resolvePath(path);
            const parts = resolved.split("/").filter(p => p);
            const name = parts.pop();
            let node = VirtualKernel.fileSystem["/"];
            for (const p of parts) {
                if (!node.children) node.children = {};
                if (!node.children[p]) return null;
                node = node.children[p];
            }
            return { parent: node, name };
        };

        const mkdirNode = (path) => {
            const r = ensureParent(path);
            if (!r) { print("mkdir: cannot create directory '" + path + "': No such file or directory"); return false; }
            if (r.parent.children[r.name]) { print("mkdir: cannot create directory '" + path + "': File exists"); return false; }
            r.parent.children[r.name] = { type: "d", children: {} };
            return true;
        };

        const touchNode = (path) => {
            const r = ensureParent(path);
            if (!r) { print("touch: cannot touch '" + path + "': No such file or directory"); return false; }
            if (!r.parent.children[r.name]) r.parent.children[r.name] = { type: "f", content: "" };
            return true;
        };

        const getPrompt = () => {
            if (VirtualKernel.powerState === "STAGE1_INPUT") return "Input: ";
            if (VirtualKernel.powerState === "STAGE2_SELECT") return "Input Option [1-2]: ";
            if (VirtualKernel.powerState === "LIVE_ISO") {
                const dir = VirtualKernel.currentDirectory === "/" ? "~" : VirtualKernel.currentDirectory;
                return VirtualKernel.isChrooted ? "sh-5.2# " : `root@archiso ${dir} # `;
            }
            if (VirtualKernel.powerState === "STAGE3_LOGIN") return "arch-jew login: ";
            if (VirtualKernel.powerState === "STAGE3_PASSWORD") return "Password: ";
            if (VirtualKernel.powerState === "STAGE3_PACMAN") return ""; 
            if (VirtualKernel.powerState === "INSTALLED_SHELL") {
                const dir = VirtualKernel.currentDirectory.replace('/home/jew', '~');
                return `[jew@arch-jew ${dir}]$ `;
            }
            if (VirtualKernel.powerState === "EPILOGUE") {
                const dir = VirtualKernel.currentDirectory.replace('/home/jew', '~');
                return `[user@debian ${dir}]$ `;
            }
            return "C:\>";
        };

        const updatePrompt = () => {
            document.getElementById('prompt').textContent = getPrompt();
            const input = document.getElementById('command-input');
            const isSecret = VirtualKernel.powerState === "STAGE3_PASSWORD" || VirtualKernel.powerState === "STAGE3_PACMAN";
            input.type = "text";
            input.style.color = isSecret ? "transparent" : "";
            input.style.caretColor = isSecret ? "#ffffff" : "";
            input.focus();
        };

        const startStage1 = () => {
            const X = Math.floor(Math.random() * 50) + 1;

            print("(C)Copyright Microsoft Corp 1981-1994.");
            print("");
            print("C:\\>");
            print("Divide overflow");
            print("");
            print("To find the password solve");

            print("");
            print("Input Option [1-2]: _");

            print("Loading live ISO installation environment...");
            print("");

            printInstruction();

            Object.assign(VirtualKernel.fileSystem["/"].children, mntChildren);

            print(":: Arch Linux 6.7.arch1-1 (TTY1)");
            await delay(400);

            await delay(300);
            print("[  OK  ] Started udev Coldplug Service.");

            await delay(300);
            print("[  OK  ] Started Accounts Service.");
            await delay(400);
            print("[  OK  ] Reached target Multi-User System.");
            await delay(500);
            print("");
            VirtualKernel.powerState = "STAGE3_LOGIN";
            printInstruction();

        const uwuFillin = () => {
            const fillers = [
                " (don't wowwy, u can do it! ^w^)",

        // --- Pipe / capture helpers ---
        const startCapture = () => { _captureBuf = []; };
        const stopCapture = () => { const r = _captureBuf; _captureBuf = null; return r || []; };

        // --- Expression sandbox ---
        const safeEval = (expr) => {
            const sanitized = expr.replace(/[^0-9+\-*/().%\s]/g, "");
            if (sanitized !== expr) throw new Error("expr: syntax error");
            return Function('"use strict"; return (' + sanitized + ')')();

        const processCommand = async (input) => {

            if (!isSecret) {

                return;

            if (VirtualKernel.powerState === "STAGE3_LOGIN") {

                saveState();
                return;
            }
            
            if (VirtualKernel.powerState === "STAGE3_PASSWORD") {
                handlePassword(cmd);
                saveState();
                return;
            }

            if (VirtualKernel.powerState === "STAGE3_PACMAN") {
                handlePacman(cmd);
                saveState();
                return;
            }

            // Check for --help / -h on any command
            if (cmd.includes(" --help") || cmd.includes(" -h")) {
                const parts2 = cmd.split(/\s+/);
                const hcmd = parts2[0];
                if (helpTexts[hcmd]) { print(helpTexts[hcmd]); saveState(); return; }
            }

            // Check for pipe operator
            if (cmd.includes(" | ")) {
                const segments = cmd.split(/\s*\|\s*/);
                let prevOut = "";
                for (let i = 0; i < segments.length; i++) {
                    _stdinData = prevOut;
                    startCapture();
                    const segInput = segments[i].trim();
                    const segParts = segInput.split(/\s+/);
                    const segBase = segParts[0];
                    if (segBase) {
                        const isSecret = VirtualKernel.powerState === "STAGE3_PASSWORD" || VirtualKernel.powerState === "STAGE3_PACMAN";
                        if (!isSecret && i === segments.length - 1) {
                            // only print prompt for last visible segment
                        }
                        // Run through switch logic via inline dispatch
                        await runCmd(segBase, segParts.slice(1), segInput);
                        if (_captureBuf) { /* captured in runCmd's saveState call — undo duplicate print */ }
                    }
                    const out = stopCapture();
                    prevOut = out.join("\n");
                }
                if (prevOut) prevOut.split("\n").forEach(l => print(l));
                saveState();
                return;
            }

            const pParts = cmd.split(/\s+/);
            await runCmd(pParts[0], pParts.slice(1), cmd);
        };

        window.onload = () => {
